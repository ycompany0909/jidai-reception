<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIDAI クロージング 受付 — 7月27日</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: rgba(15, 23, 42, 0.88);
    --line: #334155;
    --ink: #e5e7eb;
    --muted: #94a3b8;
    --accent: #8B1A1A;
    --accent2: #5a0f0f;
    --good: #16a34a;
    --good2: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #020617, #0f172a 26%, #111827);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .hero {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 18px 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 12px 24px; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; color: #fde68a; opacity: .9; }
  h1 { margin: 6px 0 6px; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 12px; }
  .pill {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    color: #fef3c7;
  }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; }
  .k { font-size: 12px; color: var(--muted); }
  .v { font-size: 26px; font-weight: 900; margin-top: 4px; line-height: 1; }
  .toolbar { display: flex; gap: 10px; margin: 14px 0; }
  .btn { border: none; border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 800; cursor: pointer; color: #fff; background: linear-gradient(135deg, #2563eb, #1e40af); }
  .btn.danger { background: linear-gradient(135deg, #991b1b, #7f1d1d); }
  .list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 52px 1.2fr auto; gap: 14px; align-items: center; }
  .row.arrived { opacity: .42; filter: grayscale(.2); }
  .no { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(139,26,26,.3), rgba(139,26,26,.12)); border: 1px solid rgba(139,26,26,.35); font-weight: 900; font-size: 18px; color: #fecaca; }
  .name { font-size: 19px; font-weight: 900; line-height: 1.25; }
  .detail { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .line { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .mini { border: none; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 800; cursor: pointer; color: #fff; background: #334155; }
  .mini.arrive { background: linear-gradient(135deg, var(--good), var(--good2)); }
  .mini.absent { background: linear-gradient(135deg, #dc2626, #991b1b); }
  .mini.cash { background: linear-gradient(135deg, #166534, #14532d); }
  .mini.card { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
  .mini.exempt { background: linear-gradient(135deg, #0f766e, #115e59); }
  .mini.active { box-shadow: 0 0 0 3px rgba(254, 240, 138, .2); outline: 2px solid rgba(253,224,71,.7); }
  @media (max-width: 768px) {
    .row { grid-template-columns: 40px 1fr; gap: 12px; }
    .no { width: 40px; height: 40px; font-size: 14px; }
    .actions { display: flex; flex-direction: row; gap: 6px; margin-top: 12px; }
    .line { gap: 4px; }
    .mini { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap" style="padding: 0 12px;">
    <div class="eyebrow">JIDAI CLOSING</div>
    <h1>クロージング 受付</h1>
    <div class="meta"><span class="pill">7月27日</span></div>
    <div class="stats">
      <div class="card"><div class="k">来場</div><div class="v" id="stat-arr">0</div></div>
      <div class="card"><div class="k">欠席</div><div class="v" id="stat-abs">0</div></div>
      <div class="card"><div class="k">計</div><div class="v" id="stat-tot">-</div></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <button class="btn" onclick="downloadCSV()">📊 CSV出力</button>
    <button class="btn danger" onclick="resetAll()">🔄 リセット</button>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
const DATA = [{"no": 1, "name": "栗原秀和", "kana": "くりはらひでかず"}, {"no": 2, "name": "堀琢磨", "kana": "ほりたくま"}, {"no": 3, "name": "後藤拡行", "kana": "ごとうひろゆき"}, {"no": 4, "name": "大松隆文", "kana": "おおまつたかふみ"}, {"no": 5, "name": "塩谷理絵", "kana": "しおやりえ"}, {"no": 6, "name": "佐藤文香", "kana": "さとうあやか"}, {"no": 7, "name": "角崎悦子", "kana": "つのざきえつこ"}, {"no": 8, "name": "パネンハルトムート", "kana": "ぱねんはるとむーと"}, {"no": 9, "name": "樋口一磨", "kana": "ひぐちかずま"}, {"no": 10, "name": "松本かずえ", "kana": "まつもとかずえ"}, {"no": 11, "name": "TavernierBaptiste", "kana": "タヴェルニエバティスト"}, {"no": 12, "name": "井上祥邦", "kana": "いのうえよしくに"}, {"no": 13, "name": "三上尚子", "kana": "みかみなおこ"}];
const KEY = 'jidai-07-27';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
function setState(no) { if (!state[no]) state[no] = {arr:null,pay:null}; return state[no]; }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); render(); }
function setArr(no, val) { setState(no).arr = val; save(); }
function setPay(no, val) { setState(no).pay = val; save(); }
function render() {
  const list = document.getElementById('list');
  const stats = {arr:0, abs:0};
  list.innerHTML = DATA.map(p => {
    const s = state[p.no] || {};
    const isArr = s.arr === true, isAbs = s.arr === false;
    if (isArr) stats.arr++; if (isAbs) stats.abs++;
    return '<div class="row ' + (isArr ? 'arrived' : '') + '"><div class="no">' + p.no + '</div><div><div class="name">' + p.name + '</div><div class="detail">' + p.kana + '</div></div><div class="actions"><div class="line"><button class="mini ' + (isArr ? 'active' : '') + ' arrive" onclick="setArr(' + p.no + ', true)">✓ 来場</button><button class="mini ' + (isAbs ? 'active' : '') + ' absent" onclick="setArr(' + p.no + ', false)">✗ 欠席</button></div><div class="line"><button class="mini ' + (s.pay==='c'?'active':'') + ' cash" onclick="setPay(' + p.no + ', \'c\')">現金</button><button class="mini ' + (s.pay==='k'?'active':'') + ' card" onclick="setPay(' + p.no + ', \'k\')">カ</button><button class="mini ' + (s.pay==='e'?'active':'') + ' exempt" onclick="setPay(' + p.no + ', \'e\')">免除</button></div></div></div>';
  }).join('');
  document.getElementById('stat-arr').textContent = stats.arr;
  document.getElementById('stat-abs').textContent = stats.abs;
  document.getElementById('stat-tot').textContent = DATA.length;
}
function downloadCSV() {
  let csv = '番号,氏名,来場,支払\n';
  DATA.forEach(p => {
    const s = state[p.no] || {};
    const arr = s.arr===true?'◯':(s.arr===false?'✗':'');
    const pay = {c:'現金',k:'カード',e:'免除'}[s.pay]||'';
    csv += p.no + ',"' + p.name + '","' + arr + '","' + pay + '"\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'JIDAI_07-27.csv';
  link.click();
}
function resetAll() {
  if (confirm('リセットしますか？')) {
    localStorage.removeItem(KEY);
    location.reload();
  }
}
render();
</script>
</body>
</html>
