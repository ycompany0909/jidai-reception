<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIDAI クロージング 受付 — v4.3-dummy (test)</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: rgba(15, 23, 42, 0.88);
    --line: #334155;
    --ink: #e5e7eb;
    --muted: #94a3b8;
    --accent: #8B1A1A;
    --accent2: #5a0f0f;
    --good: #16a34a;
    --good2: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #020617, #0f172a 26%, #111827);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .hero {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 18px 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 12px 24px; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; color: #fde68a; opacity: .9; }
  h1 { margin: 6px 0 6px; font-size: clamp(28px, 5vw, 44px); line-height: 1.05; }
  .meta { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 12px; align-items: center; }
  .pill {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    color: #fef3c7;
  }
  .sync-status {
    font-size: 11px;
    color: #94a3b8;
    padding: 2px 8px;
    background: rgba(148,163,184,.08);
    border-radius: 6px;
    font-family: 'Courier New', monospace;
  }
  .sync-status.synced { color: #16a34a; }
  .sync-status.syncing { color: #fbbf24; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  @keyframes highlight { 0% { background: rgba(245, 158, 11, .3); } 100% { background: var(--panel); } }
  .row.updated { animation: highlight 1s ease-out; }
  .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 9999; }
  .modal.show { display: flex; align-items: center; justify-content: center; }
  .modal-content { background: var(--bg); border: 1px solid var(--line); border-radius: 20px; padding: 20px; max-width: 600px; max-height: 70vh; overflow-y: auto; color: var(--ink); }
  .modal-header { font-size: 18px; font-weight: 900; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .modal-close { background: none; border: none; color: var(--ink); cursor: pointer; font-size: 20px; }
  .modal-log-entry { padding: 10px; border-bottom: 1px solid rgba(148,163,184,.18); font-size: 12px; }
  .modal-log-entry:last-child { border-bottom: none; }
  .log-timestamp { color: #0ea5e9; font-family: 'Courier New', monospace; font-weight: 800; }
  .log-operator { color: #94a3b8; font-size: 11px; margin-left: 8px; }
  .log-operation { color: #fde68a; font-weight: 800; }
  .log-change { color: #cbd5e1; margin-top: 4px; font-size: 11px; }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .payment-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; border-top: 1px solid rgba(148,163,184,.18); padding-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 13px; }
  .k { font-size: 12px; color: var(--muted); }
  .v { font-size: 26px; font-weight: 900; margin-top: 4px; line-height: 1; }
  .jumpbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 12px; padding: 10px; border: 1px solid rgba(148, 163, 184, .18); border-radius: 14px; background: rgba(15, 23, 42, .62); }
  .jumpbtn { border: 1px solid rgba(148, 163, 184, .28); background: #0b1220; color: #cbd5e1; border-radius: 999px; padding: 8px 11px; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.15s ease; }
  .jumpbtn:active { transform: scale(0.95); }
  .jumpbtn.active { color: #fde68a; border-color: rgba(245, 158, 11, .45); background: rgba(245, 158, 11, .14); }
  .jumpbtn:disabled { opacity: .32; cursor: not-allowed; }
  .toolbar { display: flex; gap: 10px; margin: 14px 0; align-items: center; }
  .search { flex: 1; border: 1px solid var(--line); background: #0b1220; color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; outline: none; }
  .search:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, .16); }
  .btn { border: none; border-radius: 14px; padding: 14px 16px; font-size: 14px; font-weight: 800; cursor: pointer; color: #fff; background: linear-gradient(135deg, #2563eb, #1e40af); white-space: nowrap; }
  .btn.danger { background: linear-gradient(135deg, #991b1b, #7f1d1d); }
  .list { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .row { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; grid-template-columns: 52px 1.2fr auto auto; gap: 14px; align-items: center; }
  .row.arrived { opacity: .42; filter: grayscale(.2); }
  .no { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(139,26,26,.3), rgba(139,26,26,.12)); border: 1px solid rgba(139,26,26,.35); font-weight: 900; font-size: 18px; color: #fecaca; }
  .name { font-size: 19px; font-weight: 900; line-height: 1.25; }
  .detail { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .timestamp { background: linear-gradient(135deg, #0ea5e9, #0284c7); padding: 8px 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 900; color: #fff; font-family: 'Courier New', monospace; }
  .actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .line { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .mini { border: none; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 800; cursor: pointer; color: #fff; background: #334155; }
  .mini.arrive { background: linear-gradient(135deg, var(--good), var(--good2)); }
  .mini.absent { background: linear-gradient(135deg, #dc2626, #991b1b); }
  .mini.cash { background: linear-gradient(135deg, #166534, #14532d); }
  .mini.card { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
  .mini.exempt { background: linear-gradient(135deg, #0f766e, #115e59); }
  .mini.undo { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
  .mini.active { box-shadow: 0 0 0 3px rgba(254, 240, 138, .2); outline: 2px solid rgba(253,224,71,.7); }
  .event-selector { border: 1px solid var(--line); background: #0b1220; color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; outline: none; cursor: pointer; font-weight: 800; }
  .event-selector:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, .16); }
  @media (max-width: 768px) {
    .row { grid-template-columns: 40px 1fr auto; gap: 12px; }
    .no { width: 40px; height: 40px; font-size: 14px; }
    .timestamp { padding: 6px 10px; font-size: 12px; }
    .actions { display: flex; flex-direction: row; gap: 6px; margin-top: 12px; }
    .line { gap: 4px; }
    .mini { padding: 8px 10px; font-size: 12px; }
    .jumpbar { gap: 4px; padding: 8px; }
    .jumpbtn { padding: 6px 9px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap" style="padding: 0 12px;">
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px;">
      <div class="eyebrow">JIDAI CLOSING</div>
      <select class="event-selector" id="eventSelector" onchange="switchEvent(this.value)">
        <option value="jidai-closing-0727">7月27日</option>
        <option value="jidai-closing-0728">7月28日</option>
        <option value="jidai-closing-0731" selected>7月31日</option>
        <option value="jidai-closing-0730">7月30日</option>
      </select>
    </div>
    <h1>クロージング 受付</h1>
    <div class="meta">
      <span class="pill" id="event-pill">7月31日 v4.1 (53名)</span>
      <span class="sync-status synced" id="sync-indicator">✓ 同期完了</span>
    </div>
    <div class="stats">
      <div class="card"><div class="k">来場</div><div class="v" id="stat-arr">0</div></div>
      <div class="card"><div class="k">欠席</div><div class="v" id="stat-abs">0</div></div>
      <div class="card"><div class="k">計</div><div class="v" id="stat-tot">-</div></div>
      <div class="card"><div class="k">更新</div><div class="v" id="stat-time" style="font-size:14px;font-family:'Courier New'">--:--</div></div>
      <div class="card"><div class="k">WebSocket</div><div class="v" id="ws-status" style="font-size:12px;color:#ef4444">⊗</div></div>
    </div>

    <div class="payment-summary">
      <div class="card"><div class="k">現金売上</div><div class="v" style="color:#16a34a">¥<span id="stat-cash">0</span></div></div>
      <div class="card"><div class="k">カード売上</div><div class="v" style="color:#0ea5e9">¥<span id="stat-card">0</span></div></div>
      <div class="card"><div class="k">免除</div><div class="v" id="stat-exempt">0人</div></div>
      <div class="card"><div class="k">総売上</div><div class="v" style="color:#fbbf24">¥<span id="stat-total">0</span></div></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="jumpbar" id="jumpbar"></div>
  <div class="toolbar">
    <input class="search" id="q" type="text" placeholder="名前・かなで検索...">
    <button class="btn" onclick="downloadCSV()">📊 CSV出力</button>
    <button class="btn" onclick="openAuditLogModal()">📋 履歴</button>
    <button class="btn" onclick="toggleAddPanel()">➕ ドタ参追加</button>
    <button class="btn" id="lock-btn" onclick="toggleLock()">🔓 アンロック</button>
    <button class="btn danger" onclick="resetAll()">🔄 リセット</button>
  </div>
  <div id="add-panel" hidden style="background:rgba(139,26,26,.08);border:1px solid rgba(139,26,26,.25);border-radius:16px;padding:16px;margin:14px 0;">
    <div style="font-size:13px;color:#fde68a;font-weight:900;margin-bottom:12px;">ドタ参追加</div>
    <div style="display:grid;gap:10px;margin-bottom:12px;">
      <input id="add-name" type="text" placeholder="氏名" style="border:1px solid #334155;background:#0b1220;color:#e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;">
      <input id="add-kana" type="text" placeholder="かな（例: たろうはなこ）" style="border:1px solid #334155;background:#0b1220;color:#e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;">
      <select id="add-payment" style="border:1px solid #334155;background:#0b1220;color:#e5e7eb;border-radius:8px;padding:8px 10px;font-size:13px;outline:none;">
        <option value="">支払方法を選択</option>
        <option value="c">現金</option>
        <option value="k">カード</option>
        <option value="e">免除</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn" style="background:linear-gradient(135deg, #16a34a, #15803d);flex:1;" onclick="addParticipant()">追加して来場打刻</button>
      <button class="btn" onclick="toggleAddPanel()" style="flex:0;">閉じる</button>
    </div>
  </div>
  <div class="list" id="list"></div>

  <div class="modal" id="auditModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>📋 操作履歴</span>
        <button class="modal-close" onclick="closeAuditLogModal()">&times;</button>
      </div>
      <div id="auditLogList"></div>
    </div>
  </div>
</div>

<script>
const DATA = [{"no": 1, "name": "佐藤太郎", "kana": "さとうたろう"}, {"no": 2, "name": "田中花子", "kana": "たなかはなこ"}, {"no": 3, "name": "鈴木次郎", "kana": "すずきじろう"}, {"no": 4, "name": "佐々木美咲", "kana": "ささきみさき"}, {"no": 5, "name": "山田健太", "kana": "やまだけんた"}, {"no": 6, "name": "伊藤由美", "kana": "いとうゆみ"}, {"no": 7, "name": "中村翔太", "kana": "なかむらしょうた"}, {"no": 8, "name": "渡辺香織", "kana": "わたなべかおり"}, {"no": 9, "name": "高橋拓也", "kana": "たかはしたくや"}, {"no": 10, "name": "小林亜衣", "kana": "こばやしあい"}, {"no": 11, "name": "加藤大輔", "kana": "かとうだいすけ"}, {"no": 12, "name": "松本由紀", "kana": "まつもとゆき"}, {"no": 13, "name": "青木勇気", "kana": "あおきゆうき"}, {"no": 14, "name": "木村優子", "kana": "きむらゆうこ"}, {"no": 15, "name": "田辺翔一", "kana": "たなべしょういち"}, {"no": 16, "name": "清水美緒", "kana": "しみずみお"}, {"no": 17, "name": "岡田英雄", "kana": "おかだひでお"}, {"no": 18, "name": "村田彩乃", "kana": "むらたあやの"}, {"no": 19, "name": "横山亮太", "kana": "よこやまりょうた"}, {"no": 20, "name": "後藤美咲", "kana": "ごとうみさき"}];

const EVENT_MAP = {
  'jidai-closing-0727': { date: '7月27日', label: '7月27日' },
  'jidai-closing-0728': { date: '7月28日', label: '7月28日' },
  'jidai-closing-0731': { date: '7月31日', label: '7月31日' },
  'jidai-closing-0730': { date: '7月30日', label: '7月30日' }
};

let currentEventId = 'jidai-closing-0731';
function getStorageKey(eventId) { return 'jidai-' + eventId.split('-')[2] + '-v4'; }
function getLockKey(eventId) { return getStorageKey(eventId) + '-lock'; }
function getSyncKey(eventId) { return getStorageKey(eventId) + '-last-sync'; }

let KEY = getStorageKey(currentEventId);
let LOCK_KEY = getLockKey(currentEventId);
let SYNC_TIME_KEY = getSyncKey(currentEventId);
let state = JSON.parse(localStorage.getItem(KEY) || '{}');
let isLocked = JSON.parse(localStorage.getItem(LOCK_KEY) || 'false');
let lastSyncTime = localStorage.getItem(SYNC_TIME_KEY) || null;
let autoSaveTimer = null;
let pollingTimer = null;
let prevState = {};
DATA.forEach(p => {
  if (!state[p.no]) state[p.no] = {arr:null, pay:null, ts:null, noshow:false};
});

const KANA_ORDER = ['あ','か','さ','た','な','は','ま','や','ら','わ'];
const KANA_RANGES = {
  'あ': ['あ','い','う','え','お'],
  'か': ['か','き','く','け','こ','が','ぎ','ぐ','げ','ご'],
  'さ': ['さ','し','す','せ','そ','ざ','じ','ず','ぜ','ぞ'],
  'た': ['た','ち','つ','て','と','だ','ぢ','づ','で','ど'],
  'な': ['な','に','ぬ','ね','の'],
  'は': ['は','ひ','ふ','へ','ほ','ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ'],
  'ま': ['ま','み','む','め','も'],
  'や': ['や','ゆ','よ'],
  'ら': ['ら','り','る','れ','ろ'],
  'わ': ['わ','を','ん']
};

function getFirstKana(name) {
  if (!name || name.length === 0) return null;
  const first = name.charAt(0);
  return first;
}

function getKanaGroup(kana) {
  for (let group of KANA_ORDER) {
    if (KANA_RANGES[group].includes(kana)) return group;
  }
  return null;
}

function buildJumpbar() {
  const groups = new Set();
  DATA.forEach(p => {
    const kana = getFirstKana(p.kana);
    const group = getKanaGroup(kana);
    if (group) groups.add(group);
  });

  const jumpbar = document.getElementById('jumpbar');
  jumpbar.innerHTML = '';
  KANA_ORDER.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'jumpbtn';
    btn.textContent = k;
    btn.onclick = () => jumpToKana(k);
    if (!groups.has(k)) btn.disabled = true;
    jumpbar.appendChild(btn);
  });
}

function jumpToKana(group) {
  const range = KANA_RANGES[group];
  const target = DATA.find(p => {
    const kana = getFirstKana(p.kana);
    return range.includes(kana);
  });
  if (target) {
    const elem = document.querySelector(`[data-no="${target.no}"]`);
    if (elem) {
      elem.scrollIntoView({ behavior: 'smooth', block: 'start' });
      elem.style.animation = 'none';
      setTimeout(() => { elem.style.animation = ''; }, 100);
    }
  }
}

function setState(no) {
  if (!state[no]) state[no] = {arr:null, pay:null, ts:null, noshow:false};
  return state[no];
}

async function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  updateSyncStatus('syncing');

  let syncFailed = false;
  const apiEndpoint = `/api/jidai/reception/${currentEventId}/state`;
  // サーバー（D1）に保存
  for (const no in state) {
    const s = state[no];
    const body = {
      no: parseInt(no),
      checkin_at: s.ts || null,
      payment_state: s.pay === 'c' ? 'cash' : s.pay === 'k' ? 'card' : s.pay === 'e' ? 'exempt' : null,
      attendance_state: s.noshow ? 'no_show' : (s.arr === true ? 'arrived' : null)
    };
    try {
      await fetch(apiEndpoint + '?data=' + encodeURIComponent(JSON.stringify(body)), {
        method: 'POST',
        credentials: 'include'
      });
    } catch (e) {
      console.error('Save to server failed:', e);
      syncFailed = true;
    }
  }

  if (!syncFailed) {
    lastSyncTime = getJSTTime();
    localStorage.setItem(SYNC_TIME_KEY, lastSyncTime);
    updateSyncStatus('synced');
  } else {
    updateSyncStatus('failed');
  }
  render();
}

function pad(n) { return n<10?'0'+n:n; }
function getJSTTime() {
  const now = new Date(Date.now() + 9*3600*1000);
  const h = pad(now.getUTCHours());
  const m = pad(now.getUTCMinutes());
  const s = pad(now.getUTCSeconds());
  return h + ':' + m + ':' + s;
}

function updateSyncStatus(status) {
  const indicator = document.getElementById('sync-indicator');
  if (!indicator) return;
  if (status === 'syncing') {
    indicator.className = 'sync-status syncing';
    indicator.textContent = '↻ 同期中...';
  } else if (status === 'synced') {
    indicator.className = 'sync-status synced';
    indicator.textContent = '✓ ' + (lastSyncTime ? lastSyncTime : '同期完了');
  } else if (status === 'failed') {
    indicator.className = 'sync-status';
    indicator.style.color = '#ef4444';
    indicator.textContent = '⚠ 同期失敗（ローカル保存）';
    setTimeout(() => {
      indicator.className = 'sync-status synced';
      indicator.textContent = '✓ ' + (lastSyncTime ? lastSyncTime : '同期完了');
    }, 3000);
  }
}

async function switchEvent(eventId) {
  currentEventId = eventId;
  KEY = getStorageKey(eventId);
  LOCK_KEY = getLockKey(eventId);
  SYNC_TIME_KEY = getSyncKey(eventId);

  // 保存前に古いデータを整理
  state = JSON.parse(localStorage.getItem(KEY) || '{}');
  isLocked = JSON.parse(localStorage.getItem(LOCK_KEY) || 'false');
  lastSyncTime = localStorage.getItem(SYNC_TIME_KEY) || null;

  // サーバーから新しいイベントのデータを復元
  await initFromServer();

  // UI 更新
  const eventInfo = EVENT_MAP[eventId];
  document.getElementById('event-pill').textContent = eventInfo.label + ' v4.1 (53名)';
  buildJumpbar();
  render();
  updateLockButton();
  updateSyncStatus('synced');
}

async function fetchAuditLog(no = null) {
  const apiEndpoint = `/api/jidai/reception/${currentEventId}/audit-log`;
  const url = no ? apiEndpoint + `?no=${no}` : apiEndpoint;
  try {
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      return data.logs || [];
    }
  } catch (e) {
    console.error('Failed to fetch audit log:', e);
  }
  return [];
}

async function openAuditLogModal() {
  const modal = document.getElementById('auditModal');
  const logList = document.getElementById('auditLogList');
  logList.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8">↻ 読み込み中...</div>';
  modal.classList.add('show');

  const logs = await fetchAuditLog();
  if (logs.length === 0) {
    logList.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8">操作履歴がありません</div>';
    return;
  }

  let html = '';
  logs.forEach(log => {
    const opLabel = {
      'update_checkin_at': '来場時刻変更',
      'update_payment_state': '支払方法変更',
      'update_attendance_state': '出席状態変更',
      'update_operator_note': 'メモ変更',
      'create': '新規作成'
    }[log.operation] || log.operation;

    const changeText = log.old_value !== log.new_value
      ? `${log.old_value || 'なし'} → ${log.new_value || 'なし'}`
      : `${log.new_value || 'なし'}`;

    html += `
      <div class="modal-log-entry">
        <div>
          <span class="log-timestamp">${log.timestamp}</span>
          <span class="log-operator">${log.operator_email || 'system'}</span>
        </div>
        <div style="margin-top:4px;">
          <span class="log-operation">${opLabel}</span>
          <span style="margin-left:8px;color:#cbd5e1;">参加者 #${log.no}</span>
        </div>
        <div class="log-change">${changeText}</div>
      </div>
    `;
  });

  logList.innerHTML = html;
}

function closeAuditLogModal() {
  const modal = document.getElementById('auditModal');
  modal.classList.remove('show');
}

async function pollRealtimeUpdates() {
  try {
    const apiEndpoint = `/api/jidai/reception/${currentEventId}/state`;
    const res = await fetch(apiEndpoint);
    if (res.ok) {
      const data = await res.json();
      if (data.rows && data.rows.length > 0) {
        data.rows.forEach(row => {
          const no = row.no;
          const newState = {
            arr: row.attendance_state === 'arrived' ? true : row.attendance_state === 'no_show' ? false : null,
            pay: row.payment_state === 'cash' ? 'c' : row.payment_state === 'card' ? 'k' : row.payment_state === 'exempt' ? 'e' : null,
            ts: row.checkin_at || null,
            noshow: row.attendance_state === 'no_show'
          };

          // Check if state changed
          const oldState = prevState[no];
          if (oldState && JSON.stringify(oldState) !== JSON.stringify(newState)) {
            // State changed → highlight row
            const row = document.querySelector(`[data-no="${no}"]`);
            if (row) {
              row.classList.remove('updated');
              void row.offsetWidth; // Trigger reflow
              row.classList.add('updated');
              setTimeout(() => row.classList.remove('updated'), 1000);
            }
          }

          prevState[no] = newState;
          state[no] = newState;
        });
      }
    }
  } catch (e) {
    console.error('Polling update failed:', e);
  }
}

function setArr(no, val) {
  const s = setState(no);
  s.arr = val;
  if (val === true) s.ts = getJSTTime();
  if (val === true) s.noshow = false;
  save();
}

function clearArr(no) {
  const s = setState(no);
  s.arr = null;
  s.ts = null;
  save();
}

function setNoShow(no) {
  const s = setState(no);
  s.noshow = true;
  s.arr = false;
  save();
}

function setPay(no, val) {
  setState(no).pay = val;
  save();
}

const PARTICIPANT_FEE = 10000;

function filteredRows() {
  const q = (document.getElementById('q').value || '').toLowerCase().trim();
  if (!q) return DATA;
  return DATA.filter(p => {
    const text = (p.name + ' ' + p.kana).toLowerCase();
    return text.includes(q);
  });
}

function isProcessed(p) {
  const s = state[p.no] || {};
  return s.arr !== null || s.noshow;
}

function renderRow(p) {
  const s = state[p.no] || {};
  const isArr = s.arr === true;
  const isNoShow = s.noshow;
  const rowClass = isProcessed(p) ? 'arrived' : '';
  const timeHtml = (isArr && s.ts) ? ('<div class="timestamp">' + s.ts + '</div>') : '';
  const disabledAttr = isLocked ? ' disabled' : '';
  const undoBtn = isArr ? ('<button class="mini undo" onclick="clearArr(' + p.no + ')"' + disabledAttr + '>↩</button>') : '';
  return '<div class="row ' + rowClass + '" data-no="' + p.no + '"><div class="no">' + p.no + '</div><div><div class="name">' + p.name + '</div><div class="detail">' + p.kana + '</div></div>' + timeHtml + '<div class="actions"><div class="line"><button class="mini ' + (isArr ? 'active' : '') + ' arrive" onclick="setArr(' + p.no + ', true)"' + disabledAttr + '>✓</button><button class="mini ' + (isNoShow ? 'active' : '') + ' absent" onclick="setNoShow(' + p.no + ')"' + disabledAttr + '>✗</button>' + undoBtn + '</div><div class="line"><button class="mini ' + (s.pay==='c'?'active':'') + ' cash" onclick="setPay(' + p.no + ', \'c\')"' + disabledAttr + '>¥</button><button class="mini ' + (s.pay==='k'?'active':'') + ' card" onclick="setPay(' + p.no + ', \'k\')"' + disabledAttr + '>カ</button><button class="mini ' + (s.pay==='e'?'active':'') + ' exempt" onclick="setPay(' + p.no + ', \'e\')"' + disabledAttr + '>免</button></div></div></div>';
}

function render() {
  const list = document.getElementById('list');
  const stats = {arr:0, abs:0, cash:0, card:0, exempt:0};
  const filtered = filteredRows();
  const pending = filtered.filter(p => !isProcessed(p));
  const processed = filtered.filter(p => isProcessed(p));

  DATA.forEach(p => {
    const s = state[p.no] || {};
    if (s.arr === true) stats.arr++;
    if (s.noshow || (s.arr === false && !s.noshow)) stats.abs++;
    if (s.pay === 'c') stats.cash++;
    if (s.pay === 'k') stats.card++;
    if (s.pay === 'e') stats.exempt++;
  });

  let html = '';
  if (pending.length > 0) {
    html += pending.map(renderRow).join('');
  } else if (filtered.length > 0) {
    html += '<div style="padding:20px;text-align:center;color:#94a3b8">未処理なし</div>';
  }

  if (processed.length > 0) {
    html += '<div style="margin-top:20px;padding:12px 0;font-size:13px;color:#fde68a;border-bottom:1px solid rgba(148,163,184,.18)">処理済み (' + processed.length + '名)</div>';
    html += processed.map(renderRow).join('');
  }

  list.innerHTML = html || '<div style="padding:20px;text-align:center;color:#94a3b8">該当者がいません</div>';

  // 売上集計
  const cashAmount = stats.cash * PARTICIPANT_FEE;
  const cardAmount = stats.card * PARTICIPANT_FEE;
  const totalAmount = cashAmount + cardAmount;

  document.getElementById('stat-arr').textContent = stats.arr;
  document.getElementById('stat-abs').textContent = stats.abs;
  document.getElementById('stat-tot').textContent = DATA.length;
  document.getElementById('stat-time').textContent = lastSyncTime || '--:--';
  document.getElementById('stat-cash').textContent = cashAmount.toLocaleString();
  document.getElementById('stat-card').textContent = cardAmount.toLocaleString();
  document.getElementById('stat-exempt').textContent = stats.exempt + '人';
  document.getElementById('stat-total').textContent = totalAmount.toLocaleString();
}

function downloadCSV() {
  let csv = '番号,氏名,来場,時刻,支払\n';
  DATA.forEach(p => {
    const s = state[p.no] || {};
    const arr = s.arr===true?'◯':(s.arr===false?'✗':'');
    const ts = s.ts || '';
    const pay = {c:'現金',k:'カード',e:'免除'}[s.pay]||'';
    csv += p.no + ',"' + p.name + '","' + arr + '","' + ts + '","' + pay + '"\n';
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'JIDAI_07-29.csv';
  link.click();
}

function resetAll() {
  if (confirm('リセットしますか？')) {
    localStorage.removeItem(KEY);
    localStorage.removeItem(LOCK_KEY);
    location.reload();
  }
}

function toggleAddPanel() {
  const panel = document.getElementById('add-panel');
  const btn = event.target;
  if (panel.hidden) {
    panel.hidden = false;
    btn.textContent = '➕ 閉じる';
    document.getElementById('add-name').focus();
  } else {
    panel.hidden = true;
    btn.textContent = '➕ ドタ参追加';
  }
}

function addParticipant() {
  const name = document.getElementById('add-name').value.trim();
  const kana = document.getElementById('add-kana').value.trim();
  const payment = document.getElementById('add-payment').value;
  if (!name) {
    alert('氏名を入力してください');
    return;
  }
  if (!payment) {
    alert('支払方法を選択してください');
    return;
  }
  const nextNo = Math.max(...DATA.map(p => p.no), 0) + 1;
  DATA.push({no: nextNo, name, kana});
  const s = setState(nextNo);
  s.pay = payment;
  setArr(nextNo, true);
  document.getElementById('add-name').value = '';
  document.getElementById('add-kana').value = '';
  document.getElementById('add-payment').value = '';
  toggleAddPanel();
  buildJumpbar();
}

function toggleLock() {
  isLocked = !isLocked;
  localStorage.setItem(LOCK_KEY, JSON.stringify(isLocked));
  updateLockButton();
  render();
}

function updateLockButton() {
  const btn = document.getElementById('lock-btn');
  if (isLocked) {
    btn.textContent = '🔒 ロック中';
    btn.style.background = 'linear-gradient(135deg, #991b1b, #7f1d1d)';
  } else {
    btn.textContent = '🔓 アンロック';
    btn.style.background = 'linear-gradient(135deg, #2563eb, #1e40af)';
  }
}

async function initFromServer() {
  try {
    const apiEndpoint = `/api/jidai/reception/${currentEventId}/state`;
    const res = await fetch(apiEndpoint);
    if (res.ok) {
      const data = await res.json();
      if (data.rows && data.rows.length > 0) {
        data.rows.forEach(row => {
          state[row.no] = {
            arr: row.attendance_state === 'arrived' ? true : row.attendance_state === 'no_show' ? false : null,
            pay: row.payment_state === 'cash' ? 'c' : row.payment_state === 'card' ? 'k' : row.payment_state === 'exempt' ? 'e' : null,
            ts: row.checkin_at || null,
            noshow: row.attendance_state === 'no_show'
          };
        });
        localStorage.setItem(KEY, JSON.stringify(state));
        lastSyncTime = getJSTTime();
        localStorage.setItem(SYNC_TIME_KEY, lastSyncTime);
      }
    }
  } catch (e) {
    console.error('Failed to load from server:', e);
  }
}

initFromServer().then(() => {
  buildJumpbar();
  render();
  updateLockButton();
  updateSyncStatus('synced');
  document.getElementById('q').addEventListener('input', render);

  // prev state snapshot（初回 polling 用）
  DATA.forEach(p => { prevState[p.no] = JSON.parse(JSON.stringify(state[p.no] || {})); });

  // auto-save interval: 毎60秒に保存
  autoSaveTimer = setInterval(() => {
    save();
  }, 60000);

  // polling interval: 毎5秒でサーバーから差分を取得（複数デバイス対応・リアルタイム同期）
  pollingTimer = setInterval(() => {
    pollRealtimeUpdates();
  }, 5000);
});
</script>
