<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受付 — 7/29</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; background: #0a0e27; color: #e2e8f0; font-size: 14px; }
  .header { background: #8B1A1A; padding: 16px 12px; text-align: center; sticky: top; }
  .stats { display: flex; gap: 12px; justify-content: center; font-size: 13px; margin-top: 8px; }
  .stat { background: rgba(255,255,255,.1); padding: 6px 10px; border-radius: 4px; }
  .container { max-width: 600px; margin: 0 auto; padding: 8px; }
  .row { background: #1a1f3a; border: 1px solid #334155; border-radius: 6px; padding: 8px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .row.checked { background: #1a3a1a; }
  .row.absent { background: #3a1a1a; }
  .name { flex: 1; min-width: 0; }
  .name-main { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .name-sub { font-size: 12px; color: #64748b; }
  .btns { display: flex; gap: 3px; flex-shrink: 0; }
  .btn { width: 28px; height: 28px; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-arr { background: #16a34a; color: white; }
  .btn-abs { background: #dc2626; color: white; }
  .btn-cash { background: #2563eb; color: white; }
  .btn-card { background: #7c3aed; color: white; }
  .btn-exempt { background: #6b7280; color: white; }
  .footer { padding: 12px; text-align: center; border-top: 1px solid #334155; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .footer button { padding: 8px 16px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; border-radius: 4px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>

<div class="header">
  <div><strong>JIDAI クロージング</strong></div>
  <div style="font-size:12px; margin-top:4px;">7月29日</div>
  <div class="stats">
    <div class="stat">来場 <strong id="stat-arr">0</strong></div>
    <div class="stat">欠席 <strong id="stat-abs">0</strong></div>
    <div class="stat">計 <strong id="stat-tot">-</strong></div>
  </div>
</div>

<div class="container" id="list"></div>

<div class="footer">
  <button onclick="downloadCSV()">CSV</button>
  <button onclick="resetAll()">リセット</button>
</div>

<script>
const DATA = [{"no": 1, "name": "今泉善雄", "kana": "いまいずみよしお"}, {"no": 2, "name": "小林利弘", "kana": "こばやしとしひろ"}, {"no": 3, "name": "田中孝樹", "kana": "たなかたかき"}, {"no": 4, "name": "紙本美善子", "kana": "かみもとみよこ"}, {"no": 5, "name": "近藤仁美", "kana": "こんどうひとみ"}, {"no": 6, "name": "内宮美知子", "kana": "うちみやみちこ"}, {"no": 7, "name": "増田海音", "kana": "ますだみおん"}, {"no": 8, "name": "佐藤悠介", "kana": "さとうゆうすけ"}, {"no": 9, "name": "仁藤敬介", "kana": "にとうけいすけ"}, {"no": 10, "name": "富山直之", "kana": "とみやまなおゆき"}, {"no": 11, "name": "菊地良実", "kana": "きくちよしみ"}, {"no": 12, "name": "藤井茂樹", "kana": "ふじいしげき"}, {"no": 13, "name": "齊藤弘太", "kana": "さいとうこうた"}, {"no": 14, "name": "はづき成美", "kana": "はづきなるみ"}, {"no": 15, "name": "塩谷理絵", "kana": "しおやりえ"}, {"no": 16, "name": "鳥井要佑", "kana": "とりいようすけ"}, {"no": 17, "name": "竹森慶之助", "kana": "たけもりけいのすけ"}, {"no": 18, "name": "ヤナギサワユキ", "kana": "ヤナギサワユキ"}, {"no": 19, "name": "佐藤文香", "kana": "さとうあやか"}, {"no": 20, "name": "内藤響", "kana": "ないとうひびき"}, {"no": 21, "name": "田代隆浩", "kana": "たしろたかひろ"}, {"no": 22, "name": "井上祥邦", "kana": "いのうえよしくに"}, {"no": 23, "name": "鈴木紗耶香", "kana": "すずきさやか"}, {"no": 24, "name": "薦田賢人", "kana": "こもだけんと"}, {"no": 25, "name": "若林沙希", "kana": "わかばやしさき"}, {"no": 26, "name": "花尾信一郎", "kana": "はなおしんいちろう"}, {"no": 27, "name": "佐々木孔明", "kana": "ささきこうめい"}, {"no": 28, "name": "吉越浩太郎", "kana": "よしごえこうたろう"}, {"no": 29, "name": "川又龍人", "kana": "かわまたりゅうと"}, {"no": 30, "name": "永岡和道", "kana": "ながおかかずみち"}, {"no": 31, "name": "進藤綾子", "kana": "しんどうあやこ"}, {"no": 32, "name": "伊藤史織", "kana": "いとうしおり"}, {"no": 33, "name": "髙橋伸彰", "kana": "たかはしのぶあき、"}, {"no": 34, "name": "鈴木舞", "kana": "すずきまい"}];

const KEY = 'jidai-07-29';
let state = JSON.parse(localStorage.getItem(KEY) || '{}');

function setState(no) {
  if (!state[no]) state[no] = { arr: null, pay: null };
  return state[no];
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
  render();
}

function setArr(no, val) {
  const s = setState(no);
  s.arr = val;
  save();
}

function setPay(no, val) {
  const s = setState(no);
  s.pay = val;
  save();
}

function render() {
  const list = document.getElementById('list');
  const stats = { arr: 0, abs: 0 };

  list.innerHTML = DATA.map(p => {
    const s = state[p.no] || {};
    const isArr = s.arr === true;
    const isAbs = s.arr === false;
    if (isArr) stats.arr++;
    if (isAbs) stats.abs++;

    return '<div class="row ' + (isArr ? 'checked' : '') + (isAbs ? ' absent' : '') + '">'
      + '<div class="name"><div class="name-main">' + p.name + '</div><div class="name-sub">' + p.kana + '</div></div>'
      + '<div class="btns">'
      + '<button class="btn btn-arr" onclick="setArr(' + p.no + ', true)">✓</button>'
      + '<button class="btn btn-abs" onclick="setArr(' + p.no + ', false)">✗</button>'
      + '<button class="btn btn-cash" onclick="setPay(' + p.no + ', \'c\')">現</button>'
      + '<button class="btn btn-card" onclick="setPay(' + p.no + ', \'k\')">カ</button>'
      + '<button class="btn btn-exempt" onclick="setPay(' + p.no + ', \'e\')">免</button>'
      + '</div></div>';
  }).join('');

  document.getElementById('stat-arr').textContent = stats.arr;
  document.getElementById('stat-abs').textContent = stats.abs;
  document.getElementById('stat-tot').textContent = DATA.length;
}

function downloadCSV() {
  let csv = '番号,氏名,来場,支払\n';
  DATA.forEach(p => {
    const s = state[p.no] || {};
    const arr = s.arr === true ? '◯' : (s.arr === false ? '✗' : '');
    const pay = {c: '現金', k: 'カード', e: '免除'}[s.pay] || '';
    csv += p.no + ',"' + p.name + '","' + arr + '","' + pay + '"\n';
  });
  const blob = new Blob([csv], { type: 'text/csv; charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'JIDAI_07-29.csv';
  link.click();
}

function resetAll() {
  if (confirm('リセットしますか？')) {
    localStorage.removeItem(KEY);
    location.reload();
  }
}

render();
</script>

</body>
</html>
